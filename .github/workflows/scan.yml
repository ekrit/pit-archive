name: daily-screener

on:
  schedule:
    # 06:30 UTC every weekday (after US market data settles from prior close).
    - cron: "30 6 * * 1-5"
    # Catch-up passes. GitHub delays — and sometimes silently drops —
    # scheduled runs under load, which would cost a collection day that can
    # never be recovered. These retries skip immediately when the day's
    # snapshot already exists (see --skip-if-collected-today), so a healthy
    # morning run makes them near-free.
    - cron: "0 11 * * 1-5"
    - cron: "0 16 * * 1-5"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write   # needed to commit results back to main

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-tests (verify evaluation math)
        run: python -m tests.selftest

      - name: Dress rehearsal (full pipeline against simulated internet)
        run: python -m tests.dress_rehearsal

      - name: Preflight (which live endpoints are reachable today)
        run: python -m scraper.preflight || true

      - name: Run screener (also appends today's point-in-time snapshot)
        env:
          # SEC's fair-access policy asks for a descriptive contact.
          # SEC fair-access requires a declared contact EMAIL. Set repo secret
          # SEC_USER_AGENT (e.g. "stocks-predictor you@example.com"); without
          # it SEC endpoints 403 and the filings source stays dark.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || format('stocks-predictor research (github.com/{0}/stocks-predictor)', github.repository_owner) }}
          # Whole-market daily-close archive (~10k tickers via SEC listing).
          FULL_MARKET_ARCHIVE: "1"
          MAX_PRICE_ARCHIVE_TICKERS: "12000"
          # Catch-up schedules must not redo a day already collected; the
          # primary schedule and manual runs always collect.
          SKIP_IF_DONE: ${{ (github.event.schedule == '0 11 * * 1-5' || github.event.schedule == '0 16 * * 1-5') && '--skip-if-collected-today' || '' }}
        run: python -m scraper.main $SKIP_IF_DONE

      - name: Data-quality gate (is today's stored snapshot actually alive?)
        # Fails the job only when collection is catastrophically broken
        # (no snapshot / price backbone dead); family problems print as WARN
        # and land in data/quality_gate.json for the weekly review.
        run: python -m scraper.quality_gate

      - name: Compact JSONL archives into the Parquet warehouse
        run: python -m scraper.warehouse compact || true

      - name: Evaluate accumulated history (what works so far)
        # Harmless while history is short (writes a "not enough data yet" note);
        # becomes meaningful automatically as snapshots accumulate over weeks.
        run: python -m scraper.evaluate --from-store --horizon 63 || true

      - name: Learned predictions (auto-activates once history suffices)
        run: python -m scraper.predict || true

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Whole data dir: rankings, history, dataset, warehouse, plus the
          # cached SEC CIK/name maps that let blocked runs use yesterday's map.
          git add data RANKINGS.md EVALUATION.md PREDICTIONS.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily rankings + history snapshot $(date -u +%Y-%m-%d)"
          # main may have moved during a long collection (code pushes, another
          # run). Merge-with-retry so a 17-minute full-market harvest is never
          # lost to a non-fast-forward rejection; on conflicting data paths the
          # freshly collected version wins (-X ours), non-conflicting incoming
          # changes are kept.
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i); merging latest main and retrying..."
            git fetch origin main
            git merge --no-edit -X ours origin/main || exit 1
            sleep $((2 * i))
          done
          echo "Failed to push after retries."
          exit 1
