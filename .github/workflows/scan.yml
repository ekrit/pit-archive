name: daily-screener

on:
  schedule:
    # 06:30 UTC every weekday (after US market data settles from prior close).
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write   # needed to commit results back to main

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        env:
          # SEC's fair-access policy asks for a descriptive contact.
          SEC_USER_AGENT: "stocks-predictor screener (github actions) contact:${{ github.repository_owner }}"
        run: python -m scraper.main

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rankings RANKINGS.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily screener rankings $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
